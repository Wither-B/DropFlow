<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DropFlow - Entrar</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-card {
            background: #1e293b;
            width: 100%;
            max-width: 400px;
            padding: 32px 24px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            border: 1px solid #334155;
        }

        .brand-title {
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            color: #38bdf8;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            color: #cbd5e1;
            margin-bottom: 8px;
            font-weight: 500;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 14px 16px;
            border-radius: 10px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: #ffffff;
            font-size: 16px; /* Evita zoom automático no Safari do iPhone */
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(135deg, #0284c7, #38bdf8);
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: opacity 0.2s;
        }

        .btn-submit:active {
            opacity: 0.9;
        }

        .footer-text {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
            color: #94a3b8;
        }

        .footer-text a {
            color: #38bdf8;
            text-decoration: none;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h1 class="brand-title">DropFlow</h1>
        <p class="subtitle">Introduza as suas credenciais para aceder</p>

        <form method="POST" action="/login">
            <div class="form-group">
                <label for="username">Utilizador ou E-mail</label>
                <input type="text" id="username" name="username" placeholder="Digite o seu utilizador" required autocomplete="username">
            </div>

            <div class="form-group">
                <label for="password">Palavra-passe</label>
                <input type="password" id="password" name="password" placeholder="Digite a sua palavra-passe" required autocomplete="current-password">
            </div>

            <button type="submit" class="btn-submit">Entrar</button>
        </form>

        <div class="footer-text">
            Ainda não tem conta? <a href="/register">Registar</a>
        </div>
    </div>

</body>
</html>
