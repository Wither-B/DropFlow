<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Login - DropFlow</title>
</head>
<body>
    <h2>Entrar no DropFlow</h2>
    <form method="POST">
        <input type="text" name="username" placeholder="Nome de utilizador" required><br><br>
        <input type="password" name="password" placeholder="Palavra-passe" required><br><br>
        <button type="submit">Login</button>
    </form>
</body>
</html>
