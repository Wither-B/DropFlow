<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DropFlow - Início</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            padding: 20px 16px;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1e293b;
            padding: 16px 20px;
            border-radius: 12px;
            border: 1px solid #334155;
            margin-bottom: 24px;
        }

        .brand-title {
            font-size: 22px;
            font-weight: 700;
            color: #38bdf8;
        }

        .btn-logout {
            color: #f87171;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            padding: 8px 12px;
            border: 1px solid #f87171;
            border-radius: 8px;
            transition: background 0.2s;
        }

        .btn-logout:active {
            background: rgba(248, 113, 113, 0.1);
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .welcome-card {
            background: #1e293b;
            padding: 24px;
            border-radius: 16px;
            border: 1px solid #334155;
            margin-bottom: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .welcome-card h2 {
            font-size: 20px;
            color: #f8fafc;
            margin-bottom: 8px;
        }

        .welcome-card p {
            font-size: 14px;
            color: #94a3b8;
            line-height: 1.5;
        }

        .grid-cards {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }

        .card {
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #334155;
        }

        .card h3 {
            font-size: 16px;
            color: #38bdf8;
            margin-bottom: 6px;
        }

        .card p {
            font-size: 13px;
            color: #cbd5e1;
        }
    </style>
</head>
<body>

    <div class="container">
        <nav class="navbar">
            <div class="brand-title">DropFlow</div>
            <a href="/login" class="btn-logout">Sair</a>
        </nav>

        <div class="welcome-card">
            <h2>Bem-vindo ao DropFlow! 👋</h2>
            <p>O seu sistema está online e a funcionar perfeitamente no Render.</p>
        </div>

        <div class="grid-cards">
            <div class="card">
                <h3>⚡ Status do Sistema</h3>
                <p>Servidor online e integrado à base de dados com sucesso.</p>
            </div>
            <div class="card">
                <h3>🚀 Próximos Passos</h3>
                <p>Pode começar a adicionar as suas funcionalidades, tabelas e fluxos de trabalho.</p>
            </div>
        </div>
    </div>

</body>
</html>
